  content:
    - categories: ARTIGOS # string (single-layer category) or array (multi-layer category)
      cover: https://raw.githubusercontent.com/cadu-sa/arquivos-site/refs/heads/main/rabisc.png # empty means random cover
    - categories: VÍDEOS
